name: window_ext
description: Desktop lifecycle extensions used by FlClash.
version: 0.0.1

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WindowExtPluginCApi
      macos:
        pluginClass: WindowExtPlugin
